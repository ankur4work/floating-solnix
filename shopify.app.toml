# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1f11bdd66beb566cff21f9da01b0ddb5"
name = "solnix-floatcart"
application_url = "https://floating.solnix.store"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
scopes = "write_cart_transforms,write_draft_orders,write_products"

[auth]
redirect_urls = [
  "https://floating.solnix.store/api/auth/callback"
]

[app_proxy]
url = "https://floating.solnix.store/api/floating-cart"
subpath = "floating-cart"
prefix = "apps"

[pos]
embedded = false
